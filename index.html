
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的个人网站</title>
<style>
body {
  margin: 0;
  background: #f2f5fa;
  font-family: Arial, sans-serif;
  color: #333;
}
.container {
  max-width: 650px;
  margin: 100px auto;
  padding: 35px;
  background: white;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 5px 25px #0001;
}
h1 { color: #3867e8; }
button {
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  background: #3867e8;
  color: white;
}
</style>
</head>
<body>
<div class="container">
  <h1>欢迎来到我的网站</h1>
  <p>这是我的第一个个人网站！</p>
  <p>这里将记录我的生活、学习和兴趣。</p>
  <button onclick="alert('你好，欢迎访问！')">
    点击我
  </button>
</div>
</body>
</html>
